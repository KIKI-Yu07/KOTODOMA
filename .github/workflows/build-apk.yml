name: Build & Sign APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          BASE_PATH: /

      - name: Copy web assets
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          echo '{"appId":"com.kotodama.app","appName":"言霊","webDir":"public","server":{"androidScheme":"https","hostname":"kotodama.app"}}' > android/app/src/main/assets/capacitor.config.json

      - name: Build APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sign APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SIGNED="kotodama-signed.apk"
          KEYSTORE="debug.keystore"
          # Generate debug keystore
          keytool -genkey -v \
            -keystore $KEYSTORE \
            -alias kotodama \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Kotodama, OU=Dev, O=Kotodama, L=Tokyo, S=Tokyo, C=JP" \
            2>/dev/null
          # Sign with apksigner
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks $KEYSTORE \
            --ks-key-alias kotodama \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out $SIGNED \
            $APK
          echo "Signed APK: $SIGNED"
          cp $SIGNED kotodama.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kotodama-signed
          path: kotodama.apk
          retention-days: 90
