name: Build Native APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          BASE_PATH: /

      - name: Copy web assets
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          echo '{"appId":"com.kotodama.app","appName":"言霊","webDir":"public"}' > android/app/src/main/assets/capacitor.config.json

      - name: Build APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          find . -type f \( -name "*.gradle" -o -name "*.properties" -o -name "gradlew" \) -exec sed -i 's/\r$//' {} \; 2>/dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate apksigner
        run: |
          echo "Looking for apksigner..."
          find / -name "apksigner" -type f 2>/dev/null | head -5
          echo "---"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No build-tools dir"

      - name: Sign APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ls -la $APK || exit 1
          # Generate keystore (jarsigner is part of JDK)
          keytool -genkey -v -keystore debug.keystore -alias kotodama \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Kotodama" 2>/dev/null
          # Try apksigner first, fallback to jarsigner
          APKSIGNER=$(find / -name "apksigner" -type f 2>/dev/null | head -1)
          if [ -n "$APKSIGNER" ]; then
            echo "Using apksigner: $APKSIGNER"
            $APKSIGNER sign --ks debug.keystore --ks-key-alias kotodama \
              --ks-pass pass:android --key-pass pass:android --out kotodama.apk $APK
          else
            echo "apksigner not found, using jarsigner"
            jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
              -keystore debug.keystore -storepass android -keypass android \
              $APK kotodama
            cp $APK kotodama.apk
          fi
          ls -la kotodama.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kotodama-native
          path: kotodama.apk
          retention-days: 90
