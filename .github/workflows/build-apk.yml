name: Build Native APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Debug Android environment
        run: |
          echo "=== Find Android SDK ==="
          find / -name "sdkmanager" 2>/dev/null | head -5
          echo "=== /usr/local/lib/android ==="
          ls /usr/local/lib/android/ 2>/dev/null || echo "not found"
          ls /usr/local/lib/android/sdk/ 2>/dev/null || echo "no sdk"
          echo "=== ANDROID_HOME ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "=== Java ==="
          java -version 2>&1
          echo "=== Gradle ==="
          which gradle 2>/dev/null || echo "no gradle"
          gradle --version 2>/dev/null || true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Verify SDK after setup
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "no platforms"
          ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "no build-tools"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          BASE_PATH: /

      - name: Copy web assets
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          echo '{"appId":"com.kotodama.app","appName":"言霊","webDir":"public"}' > android/app/src/main/assets/capacitor.config.json

      - name: Build APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          sed -i 's/\r$//' gradlew 2>/dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -80

      - name: Sign APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ls -la $APK || { echo "APK not found"; exit 1; }
          keytool -genkey -v -keystore debug.keystore -alias kotodama \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Kotodama" 2>/dev/null
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks debug.keystore --ks-key-alias kotodama \
            --ks-pass pass:android --key-pass pass:android \
            --out kotodama.apk $APK

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kotodama-native
          path: kotodama.apk
          retention-days: 90
