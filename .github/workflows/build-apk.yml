name: Build Native APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        run: |
          ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          # Install SDK 35 if not present
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true
          # Verify SDK exists
          ls $ANDROID_SDK_ROOT/platforms/ || echo "No platforms"
          ls $ANDROID_SDK_ROOT/build-tools/ || echo "No build-tools"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          BASE_PATH: /

      - name: Copy web assets
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          echo '{"appId":"com.kotodama.app","appName":"言霊","webDir":"public"}' > android/app/src/main/assets/capacitor.config.json

      - name: Build APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          sed -i 's/\r$//' gradlew 2>/dev/null || true
          chmod +x gradlew
          # Check if Gradle wrapper exists
          file gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -50

      - name: Sign APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ls -la $APK || { echo "APK not found"; exit 1; }
          keytool -genkey -v -keystore debug.keystore -alias kotodama \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Kotodama" 2>/dev/null
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks debug.keystore --ks-key-alias kotodama \
            --ks-pass pass:android --key-pass pass:android \
            --out kotodama.apk $APK

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kotodama-native
          path: kotodama.apk
          retention-days: 90
