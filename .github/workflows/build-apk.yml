name: Build Native APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        run: |
          ANDROID_SDK_ROOT=$HOME/android-sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          mkdir -p $ANDROID_SDK_ROOT
          cd $ANDROID_SDK_ROOT
          curl -sSLO https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          yes | ./cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses
          ./cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          BASE_PATH: /

      - name: Copy web assets
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          echo '{"appId":"com.kotodama.app","appName":"言霊","webDir":"public"}' > android/app/src/main/assets/capacitor.config.json

      - name: Build APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          find . -type f \( -name "*.gradle" -o -name "*.properties" -o -name "gradlew" \) -exec sed -i 's/\r$//' {} \; 2>/dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Sign APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ls -la $APK || exit 1
          keytool -genkey -v -keystore debug.keystore -alias kotodama \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Kotodama" 2>/dev/null
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks debug.keystore --ks-key-alias kotodama \
            --ks-pass pass:android --key-pass pass:android \
            --out kotodama.apk $APK
          ls -la kotodama.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kotodama-native
          path: kotodama.apk
          retention-days: 90
