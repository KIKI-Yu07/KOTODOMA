name: Release APK

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          BASE_PATH: /

      - name: Copy web assets
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          echo '{"appId":"com.kotodama.app","appName":"言霊","webDir":"public","server":{"androidScheme":"https","hostname":"kotodama.app"}}' > android/app/src/main/assets/capacitor.config.json

      - name: Build APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sign APK
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias kotodama \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Kotodama, OU=Dev, O=Kotodama, L=Tokyo, S=Tokyo, C=JP" \
            2>/dev/null
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks debug.keystore \
            --ks-key-alias kotodama \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out kotodama.apk \
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: kotodama.apk
          name: "言霊 ${{ github.ref_name }}"
          body: "📱 已签名，直接下载安装即可使用"
