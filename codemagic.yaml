workflows:
  build-apk:
    name: Build Android APK
    max_build_duration: 15
    environment:
      node: 20
      vars:
        BASE_PATH: "/"
        ANDROID_HOME: "/Users/builder/Library/Android/sdk"
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Copy web assets
        script: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          echo '{"appId":"com.kotodama.app","appName":"言霊","webDir":"public","server":{"androidScheme":"https"}}' > android/app/src/main/assets/capacitor.config.json
      - name: Build APK
        working_directory: android
        script: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
