workflows:
  build-apk:
    name: Build Android APK
    max_build_duration: 15
    environment:
      node: 22
      vars:
        CF_PAGES: "1"
        ANDROID_HOME: "/Users/builder/Library/Android/sdk"
    scripts:
      - name: Install Android SDK 34
        script: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>/dev/null
      - name: Install dependencies
        script: npm ci --legacy-peer-deps
      - name: Build web app
        script: npm run build
      - name: Sync & Build
        script: |
          npx cap sync android
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
