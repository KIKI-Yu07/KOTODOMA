workflows:
  build-apk:
    name: Build Android APK
    max_build_duration: 15
    environment:
      node: 22
      vars:
        BASE_PATH: "/"
        ANDROID_HOME: "/Users/builder/Library/Android/sdk"
    scripts:
      - name: Install Android SDK 36
        script: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" 2>/dev/null
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Build APK
        working_directory: android
        script: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
