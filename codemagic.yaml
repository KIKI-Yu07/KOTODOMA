workflows:
  build-apk:
    name: Build Android APK
    max_build_duration: 15
    environment:
      node: 22
      vars:
        BASE_PATH: "/"
        ANDROID_HOME: "/Users/builder/Library/Android/sdk"
    scripts:
      - name: Install Android SDK 35
        script: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>/dev/null
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync & Patch & Build
        script: |
          npx cap sync android
          # Patch Java version from 21 to 17
          cat android/app/capacitor.build.gradle
          sed -i.bak 's/VERSION_21/VERSION_17/g' android/app/capacitor.build.gradle
          echo "=== After patch ==="
          cat android/app/capacitor.build.gradle
          # Build
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
